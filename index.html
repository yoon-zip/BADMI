    :root{
      --bg:#0b1020;
      --card: rgba(255,255,255,0.06);
      --card2: rgba(255,255,255,0.10);
      --stroke: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --accent:#7c3aed;
      --accent2:#22c55e;
      --danger:#ef4444;
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
      --radius: 18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% 10%, rgba(124,58,237,0.35), transparent 60%),
        radial-gradient(800px 450px at 90% 20%, rgba(34,197,94,0.22), transparent 55%),
        radial-gradient(900px 700px at 50% 110%, rgba(59,130,246,0.12), transparent 55%),
        var(--bg);
      min-height:100vh;
    }

    .wrap{
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 118px;
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 0 12px;
      background: linear-gradient(180deg, rgba(11,16,32,0.92), rgba(11,16,32,0.55), rgba(11,16,32,0));
      backdrop-filter: blur(8px);
    }

    .titleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width: 0;
    }
    h1{
      margin:0;
      font-size: 18px;
      font-weight: 950;
      letter-spacing:-0.02em;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .sub{
      font-size: 11px;
      color: var(--muted);
    }

    .lang-switch{
      display:flex;
      gap:6px;
      flex-shrink:0;
    }
    .lang-switch button{
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--stroke);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 12px;
      font-weight: 900;
      cursor:pointer;
      font-size: 12px;
      line-height: 1;
    }
    .lang-switch button.active{
      background: linear-gradient(135deg, rgba(124,58,237,1), rgba(59,130,246,1));
      border-color: rgba(255,255,255,0.18);
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      margin-top: 12px;
    }
    .inner{ padding: 14px; }
    .sectionTitle{
      margin:0 0 8px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing:-0.01em;
    }
    .hint{ color: var(--muted); font-size: 13px; line-height:1.5; }
    .small{ color: var(--muted); font-size: 12px; }

    details{
      border: 1px solid var(--stroke);
      border-radius: 14px;
      background: rgba(0,0,0,0.16);
      padding: 10px 12px;
      margin-top: 10px;
    }
    summary{
      cursor:pointer;
      font-weight: 900;
      font-size: 13px;
      color: var(--text);
      list-style:none;
    }
    summary::-webkit-details-marker{ display:none; }
    .tips{
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height:1.55;
    }

    /* Video 9:16 */
    #videoContainer{
      position: relative;
      width: 100%;
      border-radius: var(--radius);
      overflow:hidden;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,0.25);
      box-shadow: var(--shadow);
    }
    #videoContainer::before{
      content:"";
      display:block;
      padding-top: 177.78%; /* 9:16 */
    }
    video, canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
    }
    canvas{ pointer-events:none; }

    .hud{
      position:absolute;
      left:12px;
      top:12px;
      z-index:5;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .pill{
      width: fit-content;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.36);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(8px);
      font-size: 12px;
      color: var(--text);
      display:flex;
      align-items:center;
      gap:8px;
    }

    .playOverlay{
      position:absolute;
      inset:0;
      z-index:10;
      display:grid;
      place-items:center;
      border:0;
      background: rgba(0,0,0,0.30);
      color: rgba(255,255,255,0.95);
      font-size: 18px;
      font-weight: 950;
      cursor:pointer;
    }
    .playOverlay .bubble{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 14px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
    }
    .playOverlay.hidden{ display:none; }

    /* Status line */
    .statusLine{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: rgba(255,255,255,0.35);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.05);
    }
    .dot.live{ background: var(--accent2); box-shadow: 0 0 0 6px rgba(34,197,94,0.18); }
    .dot.err{ background: var(--danger); box-shadow: 0 0 0 6px rgba(239,68,68,0.18); }

    /* Results */
    #results{ display:none; }
    .resultGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .metric{
      background: var(--card2);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 12px;
    }
    .metric .label{ color: var(--muted); font-size: 11px; }
    .metric .value{ margin-top: 6px; font-size: 24px; font-weight: 950; }
    .metric .unit{ font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.70); }

    .feedbackBox{
      margin-top: 10px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--stroke);
      line-height: 1.55;
      font-size: 13px;
    }
    .frameThumb{
      width:100%;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      overflow:hidden;
      background: rgba(0,0,0,0.20);
    }
    .frameThumb img{
      width:100%;
      display:block;
    }

    .rankBox{
      margin-top: 10px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--stroke);
      line-height: 1.55;
      font-size: 13px;
    }
    .rankTable{
      width:100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.88);
    }
    .rankTable th, .rankTable td{
      padding: 8px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      text-align:left;
      vertical-align: middle;

    .rankRowMe{

      border-radius: 10px;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top: 10px;
    }
    input.nick{
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 12px 12px;
      color: var(--text);
      outline: none;

    }

    /* Sticky action bar */
    .actionBar{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(11,16,32,0.75);
      border-top: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(10px);
    }
    .actionRow{
      max-width: 760px;
      margin: 0 auto;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button.action{
      border:0;
      border-radius: 14px;
      padding: 14px 14px;
      font-weight: 950;
      cursor:pointer;
      transition: transform .08s ease, opacity .12s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-size: 14px;
    }
    button.action:active{ transform: translateY(1px); }
    button.action[disabled]{ opacity:0.55; cursor:not-allowed; }

    .btn-primary{
      background: linear-gradient(135deg, rgba(124,58,237,1), rgba(59,130,246,1));
      color:white;
    }
    .btn-ghost{
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--stroke);
      color: var(--text);
    }

    @media (min-width: 900px){
      h1{ font-size: 20px; }
    }
  </style>
</head>

  // JSONP (CORS 걱정 없이 Apps Script 읽기)
  function jsonp(url){
    return new Promise((resolve, reject) => {
      const cb = "__badmi_cb_" + Math.random().toString(36).slice(2);
      const s = document.createElement("script");
      const sep = url.includes("?") ? "&" : "?";
      s.src = url + sep + "callback=" + cb;

      window[cb] = (data) => {
        try{
          resolve(data);
        } finally {
          delete window[cb];
          s.remove();
        }
      };
      s.onerror = () => {
        delete window[cb];
        s.remove();
        reject(new Error("JSONP failed"));
      };
      document.head.appendChild(s);
    });
  }

  function calculateAngle(a,b,c){
    const ab = { x: a.x - b.x, y: a.y - b.y };
    const cb = { x: c.x - b.x, y: c.y - b.y };
    const dot = ab.x*cb.x + ab.y*cb.y;
    const modAb = Math.hypot(ab.x, ab.y);
    const modCb = Math.hypot(cb.x, cb.y);
    if (modAb === 0 || modCb === 0) return 0;
    const cos = clamp(dot / (modAb*modCb), -1, 1);
    return Math.acos(cos) * 180 / Math.PI;
  }

  // ✅ 점수: "좀 짜게" + 프레임 단위 0~10
  function calculateScoreStrict(lm){
    let s = 10;

    const rs = lm[12] || {x:0,y:0}; // right shoulder
    const re = lm[14] || {x:0,y:0}; // right elbow
    const rw = lm[16] || {x:0,y:0}; // right wrist

    const lh = lm[23] || {x:0,y:0}; // left hip
    const lk = lm[25] || {x:0,y:0}; // left knee
    const la = lm[27] || {x:0,y:0}; // left ankle

    const rh = lm[24] || {x:0,y:0};
    const rk = lm[26] || {x:0,y:0};
    const ra = lm[28] || {x:0,y:0};

    // 1) 팔꿈치가 어깨보다 많이 낮으면 감점 (엄격)
    if (re.y > rs.y + 0.05) s -= 3.2;
    else if (re.y > rs.y + 0.02) s -= 1.6;

    // 2) 손목이 팔꿈치보다 너무 낮으면 감점 (임팩트/스윙 경로)
    if (rw.y > re.y + 0.06) s -= 1.4;

    // 3) 무릎 각도(양쪽 평균): 너무 펴져 있으면 감점
    const angL = calculateAngle(lh, lk, la);
    const angR = calculateAngle(rh, rk, ra);
    const ang = (angL && angR) ? (angL + angR) / 2 : (angL || angR || 0);

    if (ang > 170) s -= 2.6;
    else if (ang > 160) s -= 1.8;
    else if (ang > 150) s -= 1.0;

    // 4) 상체가 너무 세워진 프레임(대충 hip-shoulder y 차) 감점(살짝)
    const hipMidY = (lh.y + rh.y) / 2;
    const shMidY  = (lm[11]?.y ?? rs.y + 0.02 + rs.y) / 2;
    const torso = hipMidY - shMidY; // 값 클수록 상체 길게 보임
    if (torso < 0.18) s -= 0.9;

    // 5) 기본적으로 전체 점수 "짠맛" 한 번 더
    s -= 0.9;

    return clamp(s, 0, 10);
  }

  function computeFinalScore(){
    if (scoreSamples.length === 0) return 0;
    // 상위 25% 평균
    const sorted = [...scoreSamples].sort((a,b)=>b-a);
    const topCount = Math.max(8, Math.floor(sorted.length * 0.25));
    const top = sorted.slice(0, topCount);
    const avgTop = top.reduce((sum,v)=>sum+v,0) / top.length;

    // 최종 보정(짠맛 유지) + 소수점 1자리
    const final = clamp(avgTop - 0.6, 0, 10);
    return round1(final);
  }

  function sampleWristSpeedFromWorld(results){
    const wl = results.worldLandmarks?.[0];
    if (!wl) return;
    const wrist = wl[16];
    const t = videoEl.currentTime;

    if (lastWrist3d && lastTimeSec != null){
      const dt = t - lastTimeSec;
      if (dt > 0.0001){
        const dx = wrist.x - lastWrist3d.x;
        const dy = wrist.y - lastWrist3d.y;
        const dz = wrist.z - lastWrist3d.z;
        const v_ms = Math.sqrt(dx*dx + dy*dy + dz*dz) / dt;
        const v_kmh = v_ms * 3.6;
        maxSpeedKmh = Math.max(maxSpeedKmh, Math.min(300, v_kmh));
      }
    }
    lastWrist3d = wrist;
    lastTimeSec = t;
  }

  function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];

  async function startAnalysis(){

    const file = $("videoUpload").files[0];
    if (!file){ alert(t.alerts.upload); setStatus("err", t.status_nofile); return; }
    if (file.size > 100 * 1024 * 1024){ alert(t.alerts.max); return; }

    prepared = false;
    isAnalyzing = false;
    lastVideoTime = -1;
    scoreSamples = [];
    lastWrist3d = null;
    lastTimeSec = null;
    maxSpeedKmh = 0;
    finalPoseFrameUrl = null;

    $("results").style.display = "none";
    playOverlay.classList.remove("hidden");

    setHUD(t.hud_wait);
    setStatus("live", t.status_analyzing);
    setLoading(true);

    safeGtag("event","analysis_start_click",{ lang: currentLang });

    if (!poseLandmarker){
      const ok = await initPoseLandmarker();
      if (!ok){ setLoading(false); return; }
    }

    const src = URL.createObjectURL(file);
    videoEl.src = src;
    videoEl.load();

    videoEl.onloadedmetadata = () => {
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;

      prepared = true;
      setLoading(false);
      setStatus("live", t.status_ready);
      setHUD(t.hud_ready);

      resetBtn.disabled = false;
      safeGtag("event","analysis_ready",{ lang: currentLang });
    };
  }

  async function startPlayback(){
    const t = i18n[currentLang];
    if (!prepared) return;

    try{
      await videoEl.play();
      playOverlay.classList.add("hidden");

      isAnalyzing = true;
      setStatus("live", t.status_analyzing);
      setHUD(t.hud_analyzing);
      setLoading(true);

      safeGtag("event","video_play",{ lang: currentLang });
      requestAnimationFrame(analyzeLoop);
    }catch(e){
      console.error(e);
      alert(t.alerts.playfail);
    }
  }

  async function analyzeLoop(){
    if (!isAnalyzing || !poseLandmarker) return;

    const nowInMs = performance.now();
    if (videoEl.currentTime === lastVideoTime){
      requestAnimationFrame(analyzeLoop);
      return;
    }
    lastVideoTime = videoEl.currentTime;

    ctx.save();
    ctx.clearRect(0,0,canvasEl.width, canvasEl.height);
    ctx.drawImage(videoEl, 0,0, canvasEl.width, canvasEl.height);

    try{
      const results = await poseLandmarker.detectForVideo(videoEl, nowInMs);
      if (results.landmarks && results.landmarks.length > 0){
        const lm = results.landmarks[0];

        drawingUtils.drawLandmarks(lm, { color:"#ff4d4d", radius:4 });
        drawingUtils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color:"#22c55e", lineWidth:2 });

        scoreSamples.push(calculateScoreStrict(lm));
        sampleWristSpeedFromWorld(results);
      }
    }catch(e){
      console.error("Detection failed:", e);
    }

    ctx.restore();
    requestAnimationFrame(analyzeLoop);
  }

  function finishAnalysis(){
    const t = i18n[currentLang];

    isAnalyzing = false;
    setLoading(false);

    finalScore = computeFinalScore();         // ✅ 소수점 1자리
    finalSpeed = maxSpeedKmh || 0;
    finalPoseFrameUrl = canvasEl.toDataURL("image/png");

    const feedback = buildFeedback(finalScore, finalSpeed);
    renderResults(finalScore, finalSpeed, feedback, finalPoseFrameUrl);

    $("results").style.display = "block";
    setStatus("live", t.status_done);
    setHUD(t.hud_done);

    $("results").scrollIntoView({ behavior:"smooth", block:"start" });
    safeGtag("event","analysis_complete",{ score: finalScore, speed: Math.round(finalSpeed), lang: currentLang });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[m]));
  }

  function renderRankTable(top20, me){
    const t = i18n[currentLang];
    const rows = (top20 || []).map((r, idx) => {
      const isMe = me && r && me.id && r.id === me.id;
      return `
        <tr class="${isMe ? "rankRowMe" : ""}">
          <td>${idx+1}</td>
          <td>${escapeHtml(r.nick)}</td>
          <td>${Number(r.score).toFixed(1)}</td>
          <td>${Math.round(r.speed)}</td>
        </tr>
      `;
    }).join("");

    const meLine = me
      ? `<div style="margin-top:10px;"><b>${t.my_rank}:</b> #${me.rank} / ${escapeHtml(me.nick)} / ${Number(me.score).toFixed(1)} / ${Math.round(me.speed)}km/h</div>`
      : "";

    return `
      <div class="rankBox">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <div style="font-weight:950;">${t.rank_title}</div>
          <div style="color:rgba(255,255,255,0.55); font-size:12px;">${getLocalDateKey()}</div>
        </div>

        ${meLine}

        <table class="rankTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Nick</th>
              <th>Score</th>
              <th>km/h</th>
            </tr>
          </thead>
          <tbody>
            ${rows || `<tr><td colspan="4" style="color:rgba(255,255,255,0.55); padding:12px 6px;">No data yet</td></tr>`}
          </tbody>
        </table>
      </div>
    `;
  }

  async function submitRanking(nick, score, speed){
    const dateKey = getLocalDateKey();
    const url =
      `${RANK_API}?action=submit` +
      `&date=${encodeURIComponent(dateKey)}` +
      `&nick=${encodeURIComponent(nick)}` +
      `&score=${encodeURIComponent(score)}` +
      `&speed=${encodeURIComponent(Math.round(speed))}` +
      `&t=${Date.now()}`;
    return await jsonp(url);
  }

  async function fetchTop(nick){
    const dateKey = getLocalDateKey();
    const url =
      `${RANK_API}?action=top` +
      `&date=${encodeURIComponent(dateKey)}` +
      `&nick=${encodeURIComponent(nick || "")}` +
      `&t=${Date.now()}`;
    return await jsonp(url);
  }

  function renderResults(score, speed, feedback, poseFrameUrl){
    const t = i18n[currentLang];
    const savedNick = localStorage.getItem("badmi_nick") || "";

    $("resultsInner").innerHTML = `
      <div class="sectionTitle">${t.result_title}</div>

      <div class="frameThumb" style="margin-top:10px;">
        <img src="${poseFrameUrl}" alt="pose frame" />
      </div>

      <div class="resultGrid">
        <div class="metric">
          <div class="label">${t.score}</div>
          <div class="value">${Number(score).toFixed(1)}<span class="unit"> / 10</span></div>
        </div>
        <div class="metric">
          <div class="label">${t.speed}</div>
          <div class="value">${Math.round(speed)}<span class="unit"> km/h</span></div>
        </div>
      </div>

      <div class="feedbackBox">
        <b>${t.feedback_label}:</b><br/>
        ${escapeHtml(feedback)}
      </div>

      <div style="margin-top:10px;">
        <button class="action btn-ghost" id="downloadStoryButton" style="width:100%;">${t.save_story}</button>
      </div>

      <div class="row">
        <input class="nick" id="nickInput" maxlength="16" placeholder="${escapeHtml(t.nick_ph)}" value="${escapeHtml(savedNick)}" />
        <button class="action btn-primary" id="submitRankButton" style="padding:12px 14px;">🏆 ${t.submit_rank}</button>
      </div>

      <div id="rankArea"></div>
    `;

    $("downloadStoryButton").addEventListener("click", async () => {
      await downloadStoryImage({ poseFrameUrl, score, speed, feedback });
    });

    // 랭킹 조회 (닉 있으면 내순위도 같이 보여줌)
    (async ()=>{
      try{
        const data = await fetchTop(savedNick);
        $("rankArea").innerHTML = renderRankTable(data.top20, data.me);
      }catch(e){
        // silent
      }
    })();

    $("submitRankButton").addEventListener("click", async () => {
      const nick = $("nickInput").value.trim();
      if (!nick){ alert(t.alerts.nick); return; }
      localStorage.setItem("badmi_nick", nick);

      try{
        $("submitRankButton").disabled = true;
        $("submitRankButton").textContent = "⏳ ...";
        const data = await submitRanking(nick, score, speed);
        $("rankArea").innerHTML = renderRankTable(data.top20, data.me);

        safeGtag("event","rank_submit",{ nick_len: nick.length, score, speed: Math.round(speed), lang: currentLang });
      }catch(e){
        console.error(e);
        alert(t.alerts.rank_fail);
      }finally{
        $("submitRankButton").disabled = false;
        $("submitRankButton").innerHTML = `🏆 ${t.submit_rank}`;
      }
    });
  }

  // Story image generator (1080x1920)
  async function downloadStoryImage({ poseFrameUrl, score, speed, feedback }){
    const t = i18n[currentLang];
    const W = 1080, H = 1920;
    const out = document.createElement("canvas");
    out.width = W; out.height = H;
    const c = out.getContext("2d");

    // bg
    const g = c.createLinearGradient(0,0,W,H);
    g.addColorStop(0, "#0b1020");
    g.addColorStop(1, "#1b1450");
    c.fillStyle = g;
    c.fillRect(0,0,W,H);

    // title
    c.fillStyle = "rgba(255,255,255,0.92)";
    c.font = "900 54px system-ui, -apple-system, Segoe UI, Roboto";
    c.fillText(
      currentLang === "ko" ? "🏸 스매싱 분석 결과" :
      currentLang === "zh" ? "🏸 扣杀分析结果" :
      "🏸 Smash Analysis",
      70, 140
    );

    // frame
    const img = await loadImage(poseFrameUrl);
    const cardX = 70, cardY = 210, cardW = 940, cardH = 1040;

    c.save();
    roundRectPath(c, cardX, cardY, cardW, cardH, 36);
    c.clip();
    const crop = coverCrop(img.width, img.height, cardW, cardH);
    c.drawImage(img, crop.sx, crop.sy, crop.sw, crop.sh, cardX, cardY, cardW, cardH);
    c.restore();

    // pills
    drawPill(c, 70, 1320, 450, 150,
      currentLang === "ko" ? `자세 점수  ${Number(score).toFixed(1)}/10` :
      currentLang === "zh" ? `动作评分  ${Number(score).toFixed(1)}/10` :
      `Score  ${Number(score).toFixed(1)}/10`
    );
    drawPill(c, 560, 1320, 450, 150,
      currentLang === "ko" ? `스매싱 속도  ${Math.round(speed)} km/h` :
      currentLang === "zh" ? `扣杀速度  ${Math.round(speed)} km/h` :
      `Smash Speed  ${Math.round(speed)} km/h`
    );

    // feedback
    c.fillStyle = "rgba(255,255,255,0.86)";
    c.font = "700 34px system-ui, -apple-system, Segoe UI, Roboto";
    wrapText(c, feedback, 70, 1530, 940, 44, 6);

    // footer
    c.fillStyle = "rgba(255,255,255,0.45)";
    c.font = "700 26px system-ui, -apple-system, Segoe UI, Roboto";
    c.fillText("Made with badmi", 70, 1860);

    const link = document.createElement("a");
    link.download = "smash_story.png";
    link.href = out.toDataURL("image/png");
    link.click();

    safeGtag("event","download_story_image",{ score, speed: Math.round(speed), lang: currentLang });

    setTimeout(() => {
      alert(`${t.save_done_title}\n\n${t.save_done_body}`);
    }, 50);
  }

  function loadImage(src){
    return new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = src;
    });
  }
  function coverCrop(iw, ih, tw, th){
    const ir = iw/ih, tr = tw/th;
    let sw, sh, sx, sy;
    if (ir > tr){
      sh = ih;
      sw = ih * tr;
      sx = (iw - sw)/2;
      sy = 0;
    } else {
      sw = iw;
      sh = iw / tr;
      sx = 0;
      sy = (ih - sh)/2;
    }
    return { sx, sy, sw, sh };
  }
  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function drawPill(ctx, x, y, w, h, text){
    ctx.save();
    roundRectPath(ctx, x, y, w, h, 30);
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.font = "900 36px system-ui, -apple-system, Segoe UI, Roboto";
    ctx.fillText(text, x+26, y+92);
    ctx.restore();
  }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
    const words = String(text).split(" ");
    let line = "";
    let lines = 0;

    for (let n=0; n<words.length; n++){
      const test = line + words[n] + " ";
      if (ctx.measureText(test).width > maxWidth && n>0){
        ctx.fillText(line.trim(), x, y + lines*lineHeight);
        line = words[n] + " ";
        lines++;
        if (lines >= maxLines) break;
      } else {
        line = test;
      }
    }
    if (lines < maxLines) ctx.fillText(line.trim(), x, y + lines*lineHeight);
  }

  // Events
  $("videoUpload").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file && file.size > 100 * 1024 * 1024){
      alert(i18n[currentLang].alerts.max);
      e.target.value = "";
      return;
    }
    safeGtag("event","video_upload",{ lang: currentLang });
  });

  startBtn.addEventListener("click", startAnalysis);
  resetBtn.addEventListener("click", () => {
    isAnalyzing = false;
    prepared = false;
    scoreSamples = [];
    maxSpeedKmh = 0;
    lastWrist3d = null;
    lastTimeSec = null;
    finalPoseFrameUrl = null;

    ctx.clearRect(0,0,canvasEl.width, canvasEl.height);
    videoEl.pause();
    videoEl.src = "";

    $("videoUpload").value = "";
    $("results").style.display = "none";
    playOverlay.classList.remove("hidden");
    resetBtn.disabled = true;

    const t = i18n[currentLang];
    setHUD(t.hud_wait);
    setStatus("", t.status_idle);
    setLoading(false);

    safeGtag("event","reset",{ lang: currentLang });
  });

  playOverlay.addEventListener("click", startPlayback);

  videoEl.addEventListener("ended", () => {
    if (prepared) finishAnalysis();
    playOverlay.classList.remove("hidden");
  });

  videoEl.addEventListener("pause", () => {
    playOverlay.classList.remove("hidden");
  });

  // Init UI
  setLang("ko");
  setLoading(false);
  resetBtn.disabled = true;
</script>
