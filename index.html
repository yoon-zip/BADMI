  <style>
    :root{
      --bg:#0b1020;
      --card: rgba(255,255,255,0.06);
      --card2: rgba(255,255,255,0.10);
      --stroke: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --accent:#7c3aed;
      --accent2:#22c55e;
      --danger:#ef4444;
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
      --radius: 18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% 10%, rgba(124,58,237,0.35), transparent 60%),
        radial-gradient(800px 450px at 90% 20%, rgba(34,197,94,0.22), transparent 55%),
        radial-gradient(900px 700px at 50% 110%, rgba(59,130,246,0.12), transparent 55%),
        var(--bg);
      min-height:100vh;
    }
    .wrap{
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 138px;
    }
    .topbar{
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 0 12px;
      background: linear-gradient(180deg, rgba(11,16,32,0.92), rgba(11,16,32,0.55), rgba(11,16,32,0));
      backdrop-filter: blur(8px);
    }
    .titleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width: 0;
    }
    h1{
      margin:0;
      font-size: 18px;
      font-weight: 950;
      letter-spacing:-0.02em;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .sub{
      font-size: 11px;
      color: var(--muted);
    }
    .lang-switch{
      display:flex;
      gap:6px;
      flex-shrink:0;
    }
    .lang-switch button{
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--stroke);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 12px;
      font-weight: 900;
      cursor:pointer;
      font-size: 12px;
      line-height: 1;
    }
    .lang-switch button.active{
      background: linear-gradient(135deg, rgba(124,58,237,1), rgba(59,130,246,1));
      border-color: rgba(255,255,255,0.18);
    }
    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      margin-top: 12px;
    }
    .inner{ padding: 14px; }
    .sectionTitle{
      margin:0 0 8px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing:-0.01em;
    }
    .hint{ color: var(--muted); font-size: 13px; line-height:1.5; }
    .small{ color: var(--muted); font-size: 12px; }
    details{
      border: 1px solid var(--stroke);
      border-radius: 14px;
      background: rgba(0,0,0,0.16);
      padding: 10px 12px;
      margin-top: 10px;
    }
    summary{
      cursor:pointer;
      font-weight: 900;
      font-size: 13px;
      color: var(--text);
      list-style:none;
    }
    summary::-webkit-details-marker{ display:none; }
    .tips{
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height:1.55;
    }
    /* Video 9:16 */
    #videoContainer{
      position: relative;
      width: 100%;
      border-radius: var(--radius);
      overflow:hidden;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,0.25);
      box-shadow: var(--shadow);
    }
    #videoContainer::before{
      content:"";
      display:block;
      padding-top: 177.78%; /* 9:16 */
    }
    video, canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
    }
    canvas{ pointer-events:none; }
    .hud{
      position:absolute;
      left:12px;
      top:12px;
      z-index:5;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .pill{
      width: fit-content;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.36);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(8px);
      font-size: 12px;
      color: var(--text);
      display:flex;
      align-items:center;
      gap:8px;
    }
    .playOverlay{
      position:absolute;
      inset:0;
      z-index:10;
      display:grid;
      place-items:center;
      border:0;
      background: rgba(0,0,0,0.30);
      color: rgba(255,255,255,0.95);
      font-size: 18px;
      font-weight: 950;
      cursor:pointer;
    }
    .playOverlay .bubble{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 14px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
    }
    .playOverlay.hidden{ display:none; }
    /* Status line */
    .statusLine{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: rgba(255,255,255,0.35);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.05);
    }
    .dot.live{ background: var(--accent2); box-shadow: 0 0 0 6px rgba(34,197,94,0.18); }
    .dot.err{ background: var(--danger); box-shadow: 0 0 0 6px rgba(239,68,68,0.18); }
    /* Results */
    #results{ display:none; }
    .resultGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .metric{
      background: var(--card2);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 12px;
    }
    .metric .label{ color: var(--muted); font-size: 11px; }
    .metric .value{ margin-top: 6px; font-size: 24px; font-weight: 950; }
    .metric .unit{ font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.70); }
    .feedbackBox{
      margin-top: 10px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--stroke);
      line-height: 1.55;
      font-size: 13px;
    }
    .frameThumb{
      width:100%;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      overflow:hidden;
      background: rgba(0,0,0,0.20);
    }
    .frameThumb img{
      width:100%;
      display:block;
    }
    /* Ranking UI */
    .row{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:10px;
    }
    .nick{
      width:100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.18);
      color: rgba(255,255,255,0.92);
      padding: 12px 12px;
      font-weight: 850;
      outline: none;
    }
    .rankBox{
      margin-top: 10px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.12);
      overflow:auto;
    }
    .rankTitle{
      font-weight: 950;
      margin-bottom: 8px;
    }
    table.rank{
      width:100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 520px;
    }
    table.rank th, table.rank td{
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      text-align:left;
      white-space: nowrap;
    }
    table.rank th{
      color: rgba(255,255,255,0.70);
      font-size: 12px;
      font-weight: 900;
    }
    tr.meRow td{
      background: rgba(124,58,237,0.18);
    }
    .rankHint{
      margin-top: 8px;
      color: rgba(255,255,255,0.60);
      font-size: 12px;
      line-height: 1.4;
    }
    /* Sticky action bar */
    .actionBar{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(11,16,32,0.75);
      border-top: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(10px);
    }
    .actionRow{
      max-width: 760px;
      margin: 0 auto;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button.action{
      border:0;
      border-radius: 14px;
      padding: 14px 14px;
      font-weight: 950;
      cursor:pointer;
      transition: transform .08s ease, opacity .12s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-size: 14px;
    }
    button.action:active{ transform: translateY(1px); }
    button.action[disabled]{ opacity:0.55; cursor:not-allowed; }
    .btn-primary{
      background: linear-gradient(135deg, rgba(124,58,237,1), rgba(59,130,246,1));
      color:white;
    }
    .btn-ghost{
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--stroke);
      color: var(--text);
    }
    @media (min-width: 900px){
      h1{ font-size: 20px; }
    }
  </style>
</head>

<script type="module">
  import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.0";
  /************ ✅ 랭킹 서버 URL(이거만 맞추면 됨) ************/
  const RANK_API = "https://script.google.com/macros/s/AKfycbx5sF3-tuPcMAOABoKXbB9lKZdt1ix8JyK7wkdkGtpQEpspcu_VhRBDyjeF2o9KwCR0vQ/exec";
  const $ = (id) => document.getElementById(id);
  function safeGtag(...args){
    try{ if (typeof gtag === "function") gtag(...args); }catch(e){}
  }
  function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
  function round1(n){ return Math.round(n * 10) / 10; }
  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${dd}`;
  }
  // JSONP request (Apps Script용)
  function jsonp(url, timeoutMs = 9000){
    return new Promise((resolve, reject) => {
      const cbName = "__cb_" + Math.random().toString(36).slice(2);
      const sep = url.includes("?") ? "&" : "?";
      const full = url + sep + "callback=" + cbName;
      const script = document.createElement("script");
      let done = false;
      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("timeout"));
      }, timeoutMs);
      function cleanup(){
        clearTimeout(timer);
        try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }
      window[cbName] = (data) => {
        if (done) return;
        done = true;
        cleanup();
        resolve(data);
      };
      script.onerror = () => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("script_error"));
      };
      script.src = full;
      document.head.appendChild(script);
    });
  }
  async function fetchTopForToday(nickForMe=""){
    const date = todayStr();
    const url = `${RANK_API}?action=top&date=${encodeURIComponent(date)}&nick=${encodeURIComponent(nickForMe)}`;
    return await jsonp(url);
  }
  async function submitRanking(nick, score, speed){
    const date = todayStr();
    const url = `${RANK_API}?action=submit&date=${encodeURIComponent(date)}&nick=${encodeURIComponent(nick)}&score=${encodeURIComponent(score)}&speed=${encodeURIComponent(speed)}`;
    return await jsonp(url);
  }
  function escapeHtml(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function renderRankTable(top20, me){
    const rows = (top20 || []).map(r => `
      <tr class="${me && me.rank === r.rank ? "meRow" : ""}">
        <td>#${r.rank}</td>
        <td>${escapeHtml(`${r.nick} ${r.insta||""}`.trim())}</td>
        <td>${round1(r.score).toFixed(1)}</td>
        <td>${Math.round(r.speed)}</td>
      </tr>
    `).join("");
    const meRow = (me && me.nick && me.insta) ? `
      <div class="rankHint" style="margin-top:10px;">
        <b>내 기록</b> :
        ${me.rank ? `#${me.rank}위` : "오늘 기록 없음"}
        ${me.score != null ? ` · 점수 ${round1(me.score).toFixed(1)}` : ""}
        ${me.speed != null ? ` · 속도 ${Math.round(me.speed)} km/h` : ""}
      </div>
    ` : "";
    return `
      <div class="rankBox">
        <div class="rankTitle">🏆 TOP 20</div>
        <table class="rank">
          <thead>
            <tr>
              <th>순위</th>
              <th>이름 / 인스타</th>
              <th>점수</th>
              <th>속도(km/h)</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="4">아직 등록된 기록이 없어요!</td></tr>`}</tbody>
        </table>
        ${meRow}
        <div class="rankHint">※ 꼭 이름으로 안 해도 되어요!</div>
      </div>
    `;
  }
  // ✅ 페이지 상단 TOP20 로드/갱신
  async function refreshTopRank(nickForMe=""){
    const area = $("topRankArea");
    area.innerHTML = `<div class="rankBox">불러오는 중…</div>`;
    try{
      const data = await fetchTopForToday(nickForMe);
      if (!data || data.ok !== true) {
        const msg = data?.error ? `에러: ${data.error}` : "랭킹 서버 응답이 이상해요";
        area.innerHTML = `<div class="rankBox">${escapeHtml(msg)}</div>`;
        return;
      }
      area.innerHTML = renderRankTable(data.top20, data.me);
    }catch(e){
      area.innerHTML = `<div class="rankBox">랭킹 서버 연결이 잠깐 불안정해요. 조금 뒤 다시 시도해줘!</div>`;
    }
  }
  // i18n
  const i18n = {
    ko: {
      title: "🏸 배드민턴 스매싱 분석기",
      sub: "세로 촬영 권장(촬영 팁 아래 클릭)",
      step1: "1) 영상 업로드",
      step1_hint_html:

        "신체 분석이 잘 되었나 보고 싶다면 <b>재생</b> 버튼을 눌러주세요. " +
        "결과는 금방 나와요.",
      tips_title: "촬영 팁 보기",
      step2: "2) 하단 ‘분석 시작’ 버튼 누르기",
      step2_hint: "영상 가이드에 맞게 찍어주셔야 분석이 잘 되어요.",
      play: "재생",
      start: "분석 시작",
      reset: "초기화",
      privacy: "※ 업로드한 영상은 브라우저에서만 처리됩니다.",
      hud_wait: "⏳ 열심히 분석할 준비 중이에요",
      hud_ready: "✅ 준비 완료! 영상 위 재생을 눌러주세요",
      hud_analyzing: "🔎 분석 중… (끝나면 결과 표시)",
      hud_done: "✅ 분석 완료! 아래 결과 확인",
      status_idle: "대기 중",
      status_ready: "준비 완료",
      status_analyzing: "분석 중",
      status_done: "분석 완료",
      status_initfail: "초기화 실패",
      status_nofile: "영상이 없어요",
      result_title: "✅ 분석 결과",
      score: "자세 점수",
      speed: "추정 스매싱 속도",
      save_story: "📱 스토리 이미지 저장 (1080×1920)",
      feedback_label: "피드백",
      submit_rank: "랭킹 등록",
      rank_loading: "랭킹 불러오는 중…",
      tips_list: [

        "전신(발~라켓 팔 손목)이 프레임 안에 들어오게",

        rank_fail: "排行榜服务不稳定，请稍后重试。"

  };
  let currentLang = "ko";
  function setLang(lang){
    currentLang = lang;
    const t = i18n[lang] || i18n.ko;
    $("t_title").textContent = t.title;
    $("t_sub").textContent = t.sub;
    $("t_step1").textContent = t.step1;
    $("t_step1_hint").innerHTML = t.step1_hint_html;
    $("t_tips_title").textContent = t.tips_title;
    $("t_step2").textContent = t.step2;
    $("t_step2_hint").textContent = t.step2_hint;
    $("t_play").textContent = t.play;
    $("t_start").textContent = t.start;
    $("t_reset").textContent = t.reset;
    $("t_privacy").textContent = t.privacy;
    const tipsUl = $("t_tips_list");
    tipsUl.innerHTML = "";
    t.tips_list.forEach(x=>{
      const li = document.createElement("li");
      li.textContent = x;
      tipsUl.appendChild(li);
    });
    document.querySelectorAll(".lang-switch button").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });
  }
  document.querySelectorAll(".lang-switch button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      setLang(btn.dataset.lang);
      safeGtag("event", "language_switch", { lang: btn.dataset.lang });
    });
  });
  // --- Mediapipe pose setup ---
  const videoEl = $("video");
  const canvasEl = $("output_canvas");
  const ctx = canvasEl.getContext("2d");
  const drawUtils = new DrawingUtils(ctx);
  let landmarker = null;
  let rafId = null;
  let analyzing = false;
  // score/speed placeholders (여기서 네 계산 로직이 들어가면 됨)
  let lastScore = null;
  let lastSpeed = null;
  function setStatus(state){
    const dot = $("statusDot");
    const text = $("statusText");
    const loading = $("loading");
    const t = i18n[currentLang] || i18n.ko;
    dot.classList.remove("live","err");
    loading.style.display = "none";
    if (state === "idle"){
      text.textContent = t.status_idle;
    } else if (state === "ready"){
      dot.classList.add("live");
      text.textContent = t.status_ready;
    } else if (state === "analyzing"){
      dot.classList.add("live");
      text.textContent = t.status_analyzing;
      loading.style.display = "inline";
    } else if (state === "done"){
      dot.classList.add("live");
      text.textContent = t.status_done;
    } else if (state === "nofile"){
      dot.classList.add("err");
      text.textContent = t.status_nofile;
    } else if (state === "initfail"){
      dot.classList.add("err");
      text.textContent = t.status_initfail;
    }
  }
  function setHud(msg){
    $("hudPill").textContent = msg;
  }
  async function initPose(){
    try{
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
      );
      landmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task" },
        runningMode: "VIDEO",
        numPoses: 1
      });
      setHud((i18n[currentLang]||i18n.ko).hud_ready);
      setStatus("ready");
    }catch(e){
      console.error(e);
      setStatus("initfail");
      alert((i18n[currentLang]||i18n.ko).alerts.initfail);
    }
  }
  function resizeCanvas(){
    const rect = videoEl.getBoundingClientRect();
    canvasEl.width = Math.floor(rect.width * devicePixelRatio);
    canvasEl.height = Math.floor(rect.height * devicePixelRatio);
    canvasEl.style.width = rect.width + "px";
    canvasEl.style.height = rect.height + "px";
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  function clearCanvas(){
    ctx.clearRect(0,0,canvasEl.width, canvasEl.height);
  }
  function stopLoop(){
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }
  function loop(){
    if (!analyzing) return;
    if (videoEl.readyState >= 2 && landmarker){
      const nowMs = performance.now();
      const res = landmarker.detectForVideo(videoEl, nowMs);
      clearCanvas();
      if (res && res.landmarks && res.landmarks[0]){
        drawUtils.drawLandmarks(res.landmarks[0], { radius: 2 });
        drawUtils.drawConnectors(res.landmarks[0], PoseLandmarker.POSE_CONNECTIONS);
        // ✅ 여기에 너의 스코어/스피드 계산 로직을 넣으면 됨
        // 지금은 데모로 임시값을 만든다
        lastScore = clamp((lastScore ?? 40) + (Math.random()*2-1), 0, 60);
        lastSpeed = clamp((lastSpeed ?? 180) + (Math.random()*6-3), 0, 350);
      }
    }
    if (videoEl.ended){
      analyzing = false;
      setStatus("done");
      setHud((i18n[currentLang]||i18n.ko).hud_done);
      showResults();
      stopLoop();
      return;
    }
    rafId = requestAnimationFrame(loop);
  }
  function showResults(){
    const t = i18n[currentLang] || i18n.ko;
    const score = round1(lastScore ?? 0);
    const speed = Math.round(lastSpeed ?? 0);
    const html = `
      <div class="sectionTitle">${t.result_title}</div>
      <div class="resultGrid">
        <div class="metric">
          <div class="label">${t.score}</div>
          <div class="value">${score}<span class="unit"> / 100</span></div>
        </div>
        <div class="metric">
          <div class="label">${t.speed}</div>
          <div class="value">${speed}<span class="unit"> km/h</span></div>
        </div>
      </div>
      <div class="feedbackBox">
        <b>${t.feedback_label}</b><br/>
        지금은 데모 점수/속도입니다. (계산 로직 붙이면 실제 값으로 바뀜!)
      </div>
      <div class="row" style="margin-top:12px;">
        <input id="nickInput" class="nick" placeholder="이름 (또는 별명) @insta" />
      </div>
      <div class="small" style="margin-top:8px;">※ 예: 윤서 @yoondminton</div>
    `;
    $("resultsInner").innerHTML = html;
    $("results").style.display = "block";
    const actionRow = document.querySelector(".actionRow");
    const rankBtn = document.createElement("button");
    rankBtn.className = "action btn-primary";
    rankBtn.style = "padding:12px 12px; border-radius:14px; min-width:120px;";
    rankBtn.innerHTML = `🏆 ${t.submit_rank}`;
    actionRow.style.gridTemplateColumns = "1fr 1fr 1fr";
    actionRow.appendChild(rankBtn);
    rankBtn.addEventListener("click", async ()=>{
      const nick = $("nickInput").value.trim();
      if (!nick){
        alert("이름/별명을 입력해줘!");
        return;
      }
      rankBtn.disabled = true;
      rankBtn.textContent = "등록 중…";
      try{
        const r = await submitRanking(nick, score, speed);
        if (!r || r.ok !== true){
          throw new Error(r?.error || "submit failed");
        }
        // ✅ 등록 성공 → 상단 TOP20 즉시 갱신 (내 랭크도 표시)
        await refreshTopRank(nick);
        rankBtn.textContent = "✅ 등록 완료!";
        safeGtag("event", "ranking_submit", { ok: true });
      }catch(e){
        console.error(e);
        alert((i18n[currentLang]||i18n.ko).alerts.rank_fail);
        rankBtn.textContent = "🏆 랭킹 등록";
      }finally{
        rankBtn.disabled = false;
      }
    });
  }
  // ---- file upload & playback ----
  const playOverlay = $("playOverlay");
  $("videoUpload").addEventListener("change", (e)=>{
    const file = e.target.files?.[0];
    if (!file) return;
    const t = i18n[currentLang] || i18n.ko;
    if (file.size > 100 * 1024 * 1024){
      alert(t.alerts.max);
      e.target.value = "";
      return;
    }
    const url = URL.createObjectURL(file);
    videoEl.src = url;
    videoEl.load();
    lastScore = null;
    lastSpeed = null;
    $("results").style.display = "none";
    playOverlay.classList.remove("hidden");
    setStatus("ready");
    setHud(t.hud_ready);
    safeGtag("event", "video_uploaded", { size_mb: Math.round(file.size/1024/1024) });
  });
  playOverlay.addEventListener("click", async ()=>{
    playOverlay.classList.add("hidden");
    try{
      await videoEl.play();
      safeGtag("event", "video_play");
    }catch(e){
      console.error(e);
      alert((i18n[currentLang]||i18n.ko).alerts.playfail);
    }
  });
  $("startButton").addEventListener("click", ()=>{
    const t = i18n[currentLang] || i18n.ko;
    if (!videoEl.src){
      setStatus("nofile");
      alert(t.alerts.upload);
      return;
    }
    if (!landmarker){
      initPose();
      return;
    }
    analyzing = true;
    setStatus("analyzing");
    setHud(t.hud_analyzing);
    resizeCanvas();
    try{
      videoEl.currentTime = 0;
      videoEl.play().then(()=>{
        loop();
      }).catch(err=>{
        console.error(err);
        alert(t.alerts.playfail);
      });
    }catch(e){
      console.error(e);
    }
    $("resetButton").disabled = false;
  });
  $("resetButton").addEventListener("click", ()=>{
    analyzing = false;
    stopLoop();
    clearCanvas();
    try{ videoEl.pause(); }catch(e){}
    try{ videoEl.currentTime = 0; }catch(e){}
    playOverlay.classList.remove("hidden");
    $("results").style.display = "none";
    $("resetButton").disabled = true;
    lastScore = null;
    lastSpeed = null;
    setStatus("ready");
    setHud((i18n[currentLang]||i18n.ko).hud_ready);
    safeGtag("event", "reset");
  });
  window.addEventListener("resize", ()=>{
    try{ resizeCanvas(); }catch(e){}
  });
  // init
  setLang("ko");
  setStatus("idle");
  setHud((i18n[currentLang]||i18n.ko).hud_wait);
  initPose();
  // ✅ 페이지 열리면 TOP20 먼저 가져오기
  refreshTopRank("");
</script>
