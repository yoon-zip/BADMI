<head>

  <style>
    :root{
      --bg:#0b1020;
      --card: rgba(255,255,255,0.06);
      --card2: rgba(255,255,255,0.10);
      --stroke: rgba(255,255,255,0.12);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --accent:#7c3aed;
      --accent2:#22c55e;
      --danger:#ef4444;
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
      --radius: 18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% 10%, rgba(124,58,237,0.35), transparent 60%),
        radial-gradient(800px 450px at 90% 20%, rgba(34,197,94,0.22), transparent 55%),
        radial-gradient(900px 700px at 50% 110%, rgba(59,130,246,0.12), transparent 55%),
        var(--bg);
      min-height:100vh;
    }

    .wrap{
      max-width: 760px;
      margin: 0 auto;
      padding: 16px 14px 138px;
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 0 12px;
      background: linear-gradient(180deg, rgba(11,16,32,0.92), rgba(11,16,32,0.55), rgba(11,16,32,0));
      backdrop-filter: blur(8px);
    }

    .titleRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width: 0;
    }
    h1{
      margin:0;
      font-size: 18px;
      font-weight: 950;
      letter-spacing:-0.02em;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .sub{
      font-size: 11px;
      color: var(--muted);
    }

    .lang-switch{
      display:flex;
      gap:6px;
      flex-shrink:0;
    }
    .lang-switch button{
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--stroke);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 12px;
      font-weight: 900;
      cursor:pointer;
      font-size: 12px;
      line-height: 1;
    }
    .lang-switch button.active{
      background: linear-gradient(135deg, rgba(124,58,237,1), rgba(59,130,246,1));
      border-color: rgba(255,255,255,0.18);
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      margin-top: 12px;
    }
    .inner{ padding: 14px; }
    .sectionTitle{
      margin:0 0 8px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing:-0.01em;
    }
    .hint{ color: var(--muted); font-size: 13px; line-height:1.5; }
    .small{ color: var(--muted); font-size: 12px; }

    details{
      border: 1px solid var(--stroke);
      border-radius: 14px;
      background: rgba(0,0,0,0.16);
      padding: 10px 12px;
      margin-top: 10px;
    }
    summary{
      cursor:pointer;
      font-weight: 900;
      font-size: 13px;
      color: var(--text);
      list-style:none;
    }
    summary::-webkit-details-marker{ display:none; }
    .tips{
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height:1.55;
    }

    /* Video 9:16 */
    #videoContainer{
      position: relative;
      width: 100%;
      border-radius: var(--radius);
      overflow:hidden;
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,0.25);
      box-shadow: var(--shadow);
    }
    #videoContainer::before{
      content:"";
      display:block;
      padding-top: 177.78%; /* 9:16 */
    }
    video, canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
    }
    canvas{ pointer-events:none; }

    .hud{
      position:absolute;
      left:12px;
      top:12px;
      z-index:5;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .pill{
      width: fit-content;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.36);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(8px);
      font-size: 12px;
      color: var(--text);
      display:flex;
      align-items:center;
      gap:8px;
    }

    .playOverlay{
      position:absolute;
      inset:0;
      z-index:10;
      display:grid;
      place-items:center;
      border:0;
      background: rgba(0,0,0,0.30);
      color: rgba(255,255,255,0.95);
      font-size: 18px;
      font-weight: 950;
      cursor:pointer;
    }
    .playOverlay .bubble{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 14px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
    }
    .playOverlay.hidden{ display:none; }

    /* Status line */
    .statusLine{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: rgba(255,255,255,0.35);
      box-shadow: 0 0 0 6px rgba(255,255,255,0.05);
    }
    .dot.live{ background: var(--accent2); box-shadow: 0 0 0 6px rgba(34,197,94,0.18); }
    .dot.err{ background: var(--danger); box-shadow: 0 0 0 6px rgba(239,68,68,0.18); }

    /* Results */
    #results{ display:none; }
    .resultGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .metric{
      background: var(--card2);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 12px;
    }
    .metric .label{ color: var(--muted); font-size: 11px; }
    .metric .value{ margin-top: 6px; font-size: 24px; font-weight: 950; }
    .metric .unit{ font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.70); }

    .feedbackBox{
      margin-top: 10px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--stroke);
      line-height: 1.55;
      font-size: 13px;
    }
    .frameThumb{
      width:100%;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      overflow:hidden;
      background: rgba(0,0,0,0.20);
    }
    .frameThumb img{
      width:100%;
      display:block;
    }

    /* Ranking UI */
    .row{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:10px;
    }
    .nick{
      width:100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.18);
      color: rgba(255,255,255,0.92);
      padding: 12px 12px;
      font-weight: 850;
      outline: none;
    }
    .rankBox{
      margin-top: 10px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.12);
      overflow:auto;
    }
    .rankTitle{
      font-weight: 950;
      margin-bottom: 8px;
    }
    table.rank{
      width:100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 520px;
    }
    table.rank th, table.rank td{
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      text-align:left;
      white-space: nowrap;
    }
    table.rank th{
      color: rgba(255,255,255,0.70);
      font-size: 12px;
      font-weight: 900;
    }
    tr.meRow td{
      background: rgba(124,58,237,0.18);
    }
    .rankHint{
      margin-top: 8px;
      color: rgba(255,255,255,0.60);
      font-size: 12px;
      line-height: 1.4;
    }

    /* Sticky action bar */
    .actionBar{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(11,16,32,0.75);
      border-top: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(10px);
    }
    .actionRow{
      max-width: 760px;
      margin: 0 auto;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button.action{
      border:0;
      border-radius: 14px;
      padding: 14px 14px;
      font-weight: 950;
      cursor:pointer;
      transition: transform .08s ease, opacity .12s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-size: 14px;
    }
    button.action:active{ transform: translateY(1px); }
    button.action[disabled]{ opacity:0.55; cursor:not-allowed; }

    .btn-primary{
      background: linear-gradient(135deg, rgba(124,58,237,1), rgba(59,130,246,1));
      color:white;
    }
    .btn-ghost{
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--stroke);
      color: var(--text);
    }

    @media (min-width: 900px){
      h1{ font-size: 20px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="titleRow">

          <div class="sub" id="t_sub">세로 촬영 권장(촬영 팁 아래 클릭)</div>

      <div class="inner">

<script type="module">
  import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.skypack.dev/@mediapipe/tasks-vision@0.10.0";

  /************ ✅ 랭킹 서버 URL(이거만 교체!) ************/
  // 반드시 /exec 로 끝나는 "웹앱 URL" 전체를 그대로 넣기
  const RANK_API = "https://script.google.com/macros/s/AKfycbwhl5tOdASLjfB_QBB4e_HLefP5k019VaarxZQm5vGOfg7QVWmVMkp_laY9gvSh4uM8Ag/exec";

  const $ = (id) => document.getElementById(id);
  function safeGtag(...args){ try{ if (typeof gtag === "function") gtag(...args); }catch(e){} }
  function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
  function round1(n){ return Math.round(n * 10) / 10; }

  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${dd}`;
  }

  // JSONP
  function jsonp(url, timeoutMs = 9000){
    return new Promise((resolve, reject) => {
      const cbName = "__cb_" + Math.random().toString(36).slice(2);
      const sep = url.includes("?") ? "&" : "?";
      const full = url + sep + "callback=" + cbName;

      const script = document.createElement("script");
      let done = false;

      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("timeout"));
      }, timeoutMs);

      function cleanup(){
        clearTimeout(timer);
        try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; }
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = (data) => {
        if (done) return;
        done = true;
        cleanup();
        resolve(data);
      };

      script.onerror = () => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("script_error"));
      };

      script.src = full;
      document.head.appendChild(script);
    });
  }

  // ✅ GAS에 맞게: nick + insta를 각각 보냄
  async function fetchTop(name, insta){
    const date = todayStr();
    const url =
      `${RANK_API}?action=top` +
      `&date=${encodeURIComponent(date)}` +
      `&nick=${encodeURIComponent(name||"")}` +
      `&insta=${encodeURIComponent(insta||"")}`;
    return await jsonp(url);
  }

  // ✅ GAS에 맞게: nick + insta를 각각 보냄
  async function submitRanking(name, insta, score, speed){
    const date = todayStr();
    const url =
      `${RANK_API}?action=submit` +
      `&date=${encodeURIComponent(date)}` +
      `&nick=${encodeURIComponent(name)}` +
      `&insta=${encodeURIComponent(insta)}` +
      `&score=${encodeURIComponent(score)}` +
      `&speed=${encodeURIComponent(speed)}`;
    return await jsonp(url);
  }

  function escapeHtml(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function renderRankTable(top20, me){
    const rows = (top20 || []).map(r => `
      <tr class="${me && me.rank === r.rank ? "meRow" : ""}">
        <td>#${r.rank}</td>
        <td>${escapeHtml(r.nick)} ${escapeHtml(r.insta)}</td>
        <td>${round1(r.score).toFixed(1)}</td>
        <td>${Math.round(r.speed)}</td>
      </tr>
    `).join("");

    const meRow = me && me.nick ? `
      <div class="rankHint" style="margin-top:10px;">
        <b>내 기록</b> :
        ${me.rank ? `#${me.rank}위` : "오늘 기록 없음"}
        ${me.score != null ? ` · 점수 ${round1(me.score).toFixed(1)}` : ""}
        ${me.speed != null ? ` · 속도 ${Math.round(me.speed)} km/h` : ""}
      </div>
    ` : "";

    return `
      <div class="rankBox">
        <div class="rankTitle">🏆 오늘의 TOP 20</div>
        <table class="rank">
          <thead>
            <tr>
              <th>순위</th>
              <th>이름 / 인스타</th>
              <th>점수</th>
              <th>속도(km/h)</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="4">아직 등록된 기록이 없어요!</td></tr>`}</tbody>
        </table>
        ${meRow}
        <div class="rankHint">※ 중복 방지: (이름+인스타) 기준으로 하루 1회(더 좋은 기록이면 갱신)</div>
      </div>
    `;
  }

  // i18n (네 원본 그대로)
  const i18n = {
    ko: {
      title: "🏸 배드민턴 스매싱 분석기",
      sub: "세로 촬영 권장(촬영 팁 아래 클릭)",
      step1: "1) 영상 업로드",
      step1_hint_html:
        "업로드 후 아래 하단의 <b>분석 시작</b>을 누르고, " +

        "결과는 금방 나와요.",
      tips_title: "촬영 팁 보기",
      step2: "2) 하단 ‘분석 시작’ 버튼 누르기",
      step2_hint: "영상 가이드에 맞게 찍어주셔야 분석이 잘 되어요.",
      play: "재생",
      start: "분석 시작",
      reset: "초기화",
      privacy: "※ 업로드한 영상은 브라우저에서만 처리됩니다.",
      hud_wait: "⏳ 열심히 분석할 준비 중이에요",
      hud_ready: "✅ 준비 완료! 영상 위 재생을 눌러주세요",
      hud_analyzing: "🔎 분석 중… (끝나면 결과 표시)",
      hud_done: "✅ 분석 완료! 아래 결과 확인",
      status_idle: "대기 중",
      status_ready: "준비 완료",
      status_analyzing: "분석 중",
      status_done: "분석 완료",
      status_initfail: "초기화 실패",
      status_nofile: "영상이 없어요",
      result_title: "✅ 분석 결과",
      score: "자세 점수",
      speed: "추정 스매싱 속도",
      save_story: "📱 스토리 이미지 저장 (1080×1920)",
      feedback_label: "피드백",
      submit_rank: "랭킹 등록",
      rank_loading: "랭킹 불러오는 중…",
      tips_list: [
        "세로 촬영 권장",
        "전신(발~라켓 팔 손목)이 프레임 안에 들어오게",
        "밝은 조명 + 어두운 배경이 인식 안정적",
        "정면 보다는 측면 추천",
        "5~10초, 100MB 이하"
      ],
      alerts: {

  async function initPoseLandmarker(){
    try{

      );
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {

          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 1,
        minPoseDetectionConfidence: 0.3,
        minPosePresenceConfidence: 0.3,
        minTrackingConfidence: 0.3,
        outputWorldLandmarks: true

      setStatus("err", i18n[currentLang].status_initfail);

  function calculateAngle(a,b,c){
    const ab = { x: a.x - b.x, y: a.y - b.y };
    const cb = { x: c.x - b.x, y: c.y - b.y };
    const dot = ab.x*cb.x + ab.y*cb.y;
    const modAb = Math.hypot(ab.x, ab.y);
    const modCb = Math.hypot(cb.x, cb.y);
    if (modAb === 0 || modCb === 0) return 0;
    const cos = clamp(dot / (modAb*modCb), -1, 1);
    return Math.acos(cos) * 180 / Math.PI;
  }

  // 점수: 짜게
  function calculateScoreStrict(landmarks){
    let s = 10;

    const shoulderR = landmarks[12] || {x:0,y:0};
    const elbowR    = landmarks[14] || {x:0,y:0};
    const wristR    = landmarks[16] || {x:0,y:0};

    const hipL   = landmarks[23] || {x:0,y:0};
    const kneeL  = landmarks[25] || {x:0,y:0};
    const ankleL = landmarks[27] || {x:0,y:0};

    const hipR   = landmarks[24] || {x:0,y:0};
    const kneeR  = landmarks[26] || {x:0,y:0};
    const ankleR = landmarks[28] || {x:0,y:0};

    if (elbowR.y > shoulderR.y + 0.06) s -= 3.5;
    if (elbowR.y > shoulderR.y + 0.12) s -= 1.0;

    const wristDrop = wristR.y - elbowR.y;
    if (wristDrop > 0.12) s -= 1.0;

    const legAngleL = calculateAngle(hipL, kneeL, ankleL);
    const legAngleR = calculateAngle(hipR, kneeR, ankleR);
    const legAngle = (legAngleL && legAngleR) ? (legAngleL+legAngleR)/2 : (legAngleL || legAngleR || 0);

    if (legAngle > 168) s -= 3.0;
    else if (legAngle > 160) s -= 2.0;
    else if (legAngle > 150) s -= 1.0;

    if (legAngleL && legAngleR && Math.abs(legAngleL - legAngleR) > 18) s -= 1.0;

    s = s - 0.6;
    return clamp(s, 0, 10);
  }

  function computeFinalScore(){
    if (scoreSamples.length === 0) return 0;
    const sorted = [...scoreSamples].sort((a,b)=>b-a);
    const topCount = Math.max(6, Math.floor(sorted.length * 0.25));
    const top = sorted.slice(0, topCount);
    const avgTop = top.reduce((sum,v)=>sum+v,0) / top.length;
    return round1(avgTop);
  }

  function sampleWristSpeedFromWorld(results){
    const wl = results.worldLandmarks?.[0];
    if (!wl) return;
    const wrist = wl[16];
    const t = videoEl.currentTime;

    if (lastWrist3d && lastTimeSec != null){
      const dt = t - lastTimeSec;
      if (dt > 0.0001){
        const dx = wrist.x - lastWrist3d.x;
        const dy = wrist.y - lastWrist3d.y;
        const dz = wrist.z - lastWrist3d.z;
        const v_ms = Math.sqrt(dx*dx + dy*dy + dz*dz) / dt;
        const v_kmh = Math.round(v_ms * 3.6);
        maxSpeedKmh = Math.max(maxSpeedKmh, Math.min(300, v_kmh));
      }
    }
    lastWrist3d = wrist;
    lastTimeSec = t;
  }

  async function startAnalysis(){
    const t = i18n[currentLang];
    const file = $("videoUpload").files[0];
    if (!file){ alert(t.alerts.upload); setStatus("err", t.status_nofile); return; }
    if (file.size > 100 * 1024 * 1024){ alert(t.alerts.max); return; }

    prepared = false;
    isAnalyzing = false;
    lastVideoTime = -1;
    scoreSamples = [];
    lastWrist3d = null;
    lastTimeSec = null;
    maxSpeedKmh = 0;
    finalPoseFrameUrl = null;

    $("results").style.display = "none";
    playOverlay.classList.remove("hidden");

    setHUD(t.hud_wait);
    setStatus("live", t.status_analyzing);
    setLoading(true);

    safeGtag("event","analysis_start_click",{ lang: currentLang });

    if (!poseLandmarker){
      const ok = await initPoseLandmarker();
      if (!ok){ setLoading(false); return; }
    }

    const src = URL.createObjectURL(file);
    videoEl.src = src;
    videoEl.load();

    videoEl.onloadedmetadata = () => {
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;

      prepared = true;
      setLoading(false);
      setStatus("live", t.status_ready);
      setHUD(t.hud_ready);

      resetBtn.disabled = false;
      safeGtag("event","analysis_ready",{ lang: currentLang });
    };
  }

  async function startPlayback(){
    const t = i18n[currentLang];
    if (!prepared) return;

    try{
      await videoEl.play();
      playOverlay.classList.add("hidden");

      isAnalyzing = true;
      setStatus("live", t.status_analyzing);
      setHUD(t.hud_analyzing);
      setLoading(true);

      safeGtag("event","video_play",{ lang: currentLang });
      requestAnimationFrame(analyzeLoop);
    }catch(e){
      console.error(e);
      alert(t.alerts.playfail);
    }
  }

  async function analyzeLoop(){
    if (!isAnalyzing || !poseLandmarker) return;

    const nowInMs = performance.now();
    if (videoEl.currentTime === lastVideoTime){
      requestAnimationFrame(analyzeLoop);
      return;
    }
    lastVideoTime = videoEl.currentTime;

    ctx.save();
    ctx.clearRect(0,0,canvasEl.width, canvasEl.height);
    ctx.drawImage(videoEl, 0,0, canvasEl.width, canvasEl.height);

    try{
      const results = await poseLandmarker.detectForVideo(videoEl, nowInMs);
      if (results.landmarks && results.landmarks.length > 0){
        const lm = results.landmarks[0];

        drawingUtils.drawLandmarks(lm, { color:"#ff4d4d", radius:4 });
        drawingUtils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color:"#22c55e", lineWidth:2 });

        scoreSamples.push(calculateScoreStrict(lm));
        sampleWristSpeedFromWorld(results);
      }
    }catch(e){
      console.error("Detection failed:", e);
    }

    ctx.restore();
    requestAnimationFrame(analyzeLoop);
  }

  function finishAnalysis(){
    const t = i18n[currentLang];

    isAnalyzing = false;
    setLoading(false);

    finalScore = computeFinalScore(); // 소수점 1자리
    finalSpeed = maxSpeedKmh || 0;
    finalPoseFrameUrl = canvasEl.toDataURL("image/png");

    const feedback = getFeedback(finalScore, finalSpeed);
    renderResults(finalScore, finalSpeed, feedback, finalPoseFrameUrl);

    $("results").style.display = "block";
    setStatus("live", t.status_done);
    setHUD(t.hud_done);

    $("results").scrollIntoView({ behavior:"smooth", block:"start" });
    safeGtag("event","analysis_complete",{ score: finalScore, speed: finalSpeed, lang: currentLang });
  }

  function renderResults(score, speed, feedback, poseFrameUrl){
    const t = i18n[currentLang];

    const savedName = localStorage.getItem("badmi_name") || "";
    const savedInsta = localStorage.getItem("badmi_insta") || "";

    $("resultsInner").innerHTML = `
      <div class="sectionTitle">${t.result_title}</div>

      <div class="frameThumb" style="margin-top:10px;">
        <img src="${poseFrameUrl}" alt="pose frame" />
      </div>

      <div class="resultGrid">
        <div class="metric">
          <div class="label">${t.score}</div>
          <div class="value">${round1(score).toFixed(1)}<span class="unit"> / 10</span></div>
        </div>
        <div class="metric">
          <div class="label">${t.speed}</div>
          <div class="value">${Math.round(speed)}<span class="unit"> km/h</span></div>
        </div>
      </div>

      <div class="feedbackBox">
        <b>${t.feedback_label}:</b><br/>
        ${escapeHtml(feedback).replaceAll("\n","<br/>")}
      </div>

      <div class="row" style="flex-direction:column; align-items:stretch;">
        <input class="nick" id="nameInput" maxlength="10" placeholder="${currentLang==="ko" ? "이름 (예: 윤서)" : currentLang==="zh" ? "姓名（例：Yoon）" : "Name (e.g., Yoon)"}" value="${escapeHtml(savedName)}" />
        <input class="nick" id="instaInput" maxlength="20" placeholder="${currentLang==="ko" ? "인스타 아이디 (예: @yoondminton)" : currentLang==="zh" ? "Instagram（例：@yoondminton）" : "Instagram (e.g., @yoondminton)"}" value="${escapeHtml(savedInsta)}" />
        <button class="action btn-primary" id="submitRankButton" style="width:100%;">🏆 ${t.submit_rank}</button>
      </div>

      <div id="rankArea" style="margin-top:10px;">
        <div class="rankBox">${t.rank_loading}</div>
      </div>
    `;

    // ✅ 초기 랭킹 조회 (저장된 이름+인스타 기준)
    (async ()=>{
      try{
        const data = await fetchTop(savedName, savedInsta);
        $("rankArea").innerHTML = renderRankTable(data.top20, data.me);
      }catch(e){
        $("rankArea").innerHTML = `<div class="rankBox">${i18n[currentLang].alerts.rank_fail}</div>`;
      }
    })();

    // 제출
    $("submitRankButton").addEventListener("click", async () => {
      const name = $("nameInput").value.trim();
      let insta = $("instaInput").value.trim();

      if (!name){ alert(currentLang==="ko" ? "이름을 입력해줘!" : currentLang==="zh" ? "请输入姓名！" : "Please enter your name!"); return; }
      if (!insta){ alert(currentLang==="ko" ? "인스타 아이디를 입력해줘!" : currentLang==="zh" ? "请输入 Instagram！" : "Please enter your Instagram!"); return; }
      if (!insta.startsWith("@")) insta = "@" + insta;

      localStorage.setItem("badmi_name", name);
      localStorage.setItem("badmi_insta", insta);

      try{
        $("submitRankButton").disabled = true;
        $("submitRankButton").textContent = "⏳ ...";

        const data = await submitRanking(name, insta, round1(score).toFixed(1), Math.round(speed));
        $("rankArea").innerHTML = renderRankTable(data.top20, data.me);

        safeGtag("event","rank_submit",{ lang: currentLang, score: round1(score), speed: Math.round(speed) });
      }catch(e){
        console.error(e);
        alert(i18n[currentLang].alerts.rank_fail);
      }finally{
        $("submitRankButton").disabled = false;
        $("submitRankButton").innerHTML = `🏆 ${i18n[currentLang].submit_rank}`;
      }
    });
  }

  // Events
  $("videoUpload").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file && file.size > 100 * 1024 * 1024){
      alert(i18n[currentLang].alerts.max);
      e.target.value = "";
      return;
    }
    safeGtag("event","video_upload",{ lang: currentLang });
  });

  startBtn.addEventListener("click", startAnalysis);
  resetBtn.addEventListener("click", () => {
    isAnalyzing = false;
    prepared = false;
    scoreSamples = [];
    maxSpeedKmh = 0;
    lastWrist3d = null;
    lastTimeSec = null;
    finalPoseFrameUrl = null;

    ctx.clearRect(0,0,canvasEl.width, canvasEl.height);
    videoEl.pause();
    videoEl.src = "";

    $("videoUpload").value = "";
    $("results").style.display = "none";
    playOverlay.classList.remove("hidden");
    resetBtn.disabled = true;

    const t = i18n[currentLang];
    setHUD(t.hud_wait);
    setStatus("", t.status_idle);
    setLoading(false);

    safeGtag("event","reset",{ lang: currentLang });
  });

  playOverlay.addEventListener("click", startPlayback);

  videoEl.addEventListener("ended", () => {
    if (prepared) finishAnalysis();
    playOverlay.classList.remove("hidden");
  });

  videoEl.addEventListener("pause", () => {
    playOverlay.classList.remove("hidden");
  });

  // Init UI
  setLang("ko");
  setLoading(false);
  resetBtn.disabled = true;
</script>
</body>
</html>
